// ---------- weapons ----------
function selectWeapon(w, silent){
  if(bfgCharge > 0) return;
  if(w === weapon && switchT === 0) return;
  if(!owned[w]){ if(!silent) msg(T('no_weapon'), '#999'); return; }
  if(!canFire(w)){ if(!silent) msg(T('no_ammo', wName(w)), '#ff6644'); return; }
  pendingWeapon = w; switchT = 14;
}
function selectSlot(s){
  if(s === 0){
    const cur = pendingWeapon >= 0 && switchT > 0 ? pendingWeapon : weapon;
    if(owned[1] && cur !== 1) selectWeapon(1); else selectWeapon(0);
    return;
  }
  selectWeapon(s + 1);
}
function cycleWeapon(dir){
  const avail = [0, 1, 2, 3, 4, 5, 6, 7, 8].filter(w => canFire(w) && !(w === 0 && owned[1]));
  if(avail.length < 2) return;
  const cur = pendingWeapon >= 0 && switchT > 0 ? pendingWeapon : weapon;
  let i = avail.indexOf(cur); if(i < 0) i = 0;
  selectWeapon(avail[(i + dir + avail.length) % avail.length]);
}
function bestWeapon(){ for(const w of [5, 3, 2, 7, 1, 0]) if(canFire(w)) return w; return 0; }
function autoSwitch(){ const w = bestWeapon(); if(w !== weapon) selectWeapon(w, true); }
function pressFire(){ tryFire(); }
function tryFire(){
  if(dead || ending || levelTransition > 0 || switchT > 0 || fireCD > 0 || bfgCharge > 0) return false;
  const Wp = WEAPONS[weapon];
  if(!canFire(weapon)){ AudioSys.play('empty'); fireCD = 15; autoSwitch(); return false; }
  const a = player.angle;
  fireCD = Wp.cd;
  if(weapon === 0){
    punchT = 14; AudioSys.play('swish');
    const hit = melee(1.0, 1.2);
    if(hit){ AudioSys.play('punch', hit.x, hit.y); stats.hits++; }
    stats.shots++;
    return true;
  }
  if(weapon === 1){
    sawT++;
    const hit = melee(1.25, 0.5);
    AudioSys.play(hit ? 'sawHit' : 'sawRev');
    if(hit){ const want = Math.atan2(hit.y - player.y, hit.x - player.x); player.angle += angleDiff(want, player.angle) * 0.18; shake = Math.max(shake, 1.5); }
    return true;
  }
  stats.shots++;
  ammo[Wp.ammo] -= Wp.cost;
  if(weapon === 2){
    gunFlash = 4; recoil = Math.min(recoil + 4, 10);
    if(hitscan(a + rand(-0.022, 0.022), 22, 1)) stats.hits++;
    AudioSys.play('smg'); makeNoise(12);
  } else if(weapon === 3){
    gunFlash = 7; recoil = 16; shake = Math.max(shake, 5);
    let any = false;
    for(let p = 0; p < 7; p++) if(hitscan(a + (p / 6 - 0.5) * 0.2 + rand(-0.02, 0.02), 14, 1, true)) any = true;
    if(any) stats.hits++;
    AudioSys.play('shotgun'); makeNoise(16);
  } else if(weapon === 4){
    gunFlash = 6; recoil = 14; shake = Math.max(shake, 4);
    const ca = Math.cos(a), sa = Math.sin(a);
    projectiles.push({ kind: 'rocket', mine: true, x: player.x + ca * 0.35, y: player.y + sa * 0.35, z: 0.42, vx: ca * 0.17, vy: sa * 0.17, life: 220 });
    AudioSys.play('rocketFire'); makeNoise(14);
  } else if(weapon === 5){
    gunFlash = 6; recoil = Math.min(recoil + 5, 10);
    const ca = Math.cos(a), sa = Math.sin(a);
    projectiles.push({ kind: 'plasma', mine: true, x: player.x + ca * 0.3, y: player.y + sa * 0.3, z: 0.42, vx: ca * 0.13, vy: sa * 0.13, life: 160 });
    AudioSys.play('plasma'); makeNoise(10);
  } else if(weapon === 6){
    ammo.cel += Wp.cost;                     // paid when the shot actually leaves the barrel
    stats.shots--;
    bfgCharge = 34; AudioSys.play('bfgCharge'); makeNoise(16);
  } else if(weapon === 7){
    // flamethrower: a stream of burning puffs that grow, slow down and pass through everything they burn
    stats.shots--;

// Instant bullet: stops at the first wall/door, hits only the nearest monster on the line
function hitscan(angle, range, dmg, pellet){
  const ca = Math.cos(angle), sa = Math.sin(angle);
  const wallD = rayDist(player.x, player.y, ca, sa, range);
  let best = null, bestT = wallD;
  for(const e of enemies){
    if(e.dead) continue;
    const dx = e.x - player.x, dy = e.y - player.y, t = dx * ca + dy * sa;
    if(t <= 0.05 || t >= bestT) continue;
    if(Math.abs(-dx * sa + dy * ca) < e.hitR){ best = e; bestT = t; }
  }
  const hx = player.x + ca * bestT, hy = player.y + sa * bestT;
  if(best){
    let d = dmg; if(pellet && bestT > 6) d *= 0.6;
    damageEnemy(best, d, hx, hy);
    return best.type !== 'barrel';
  }
  if(wallD < range){
    spawnDust(hx - ca * 0.04, hy - sa * 0.04, 0.5 + rand(-0.08, 0.08), pellet ? 2 : 4);
    if(!pellet || Math.random() < 0.3) AudioSys.play('wallHit', hx, hy);
  }
  return false;
}
function melee(range, dmg){
  let best = null, bd = 1e9;
  for(const e of enemies){
    if(e.dead) continue;
    const dx = e.x - player.x, dy = e.y - player.y, d = Math.hypot(dx, dy);
    if(d - e.hitR > range) continue;
    if(Math.abs(angleDiff(Math.atan2(dy, dx), player.angle)) > (d < 0.8 ? 0.9 : 0.5)) continue;
    if(!losClear(player.x, player.y, e.x, e.y)) continue;
    if(d < bd){ bd = d; best = e; }
  }
  if(best){
    const hx = best.x - (best.x - player.x) / bd * best.hitR, hy = best.y - (best.y - player.y) / bd * best.hitR;
    damageEnemy(best, dmg, hx, hy);
    if(weapon === 1) spawnBlood(hx, hy, 0.45, 4, best.type === 'phantom');
  }
  return best;
}

function damageEnemy(e, dmg, hx, hy, src){
  if(e.dead) return;
  if(hx === undefined){ hx = e.x; hy = e.y; }
  if(e.type === 'barrel'){
    e.hp -= dmg;
    if(e.hp <= 0 && !e.fuse) e.fuse = src === 'boom' ? 6 + ((Math.random() * 8) | 0) : 1;
    return;
  }
  wake(e);
  if(e.type === 'spider' && e.rushState === 3) dmg *= 2;
  // a Paladin's tower shield stops what comes at it from the front (explosions, fire and lightning get around it)
  if(e.type === 'paladin' && e.guard && src !== 'boom' && src !== 'fire' && src !== 'zap'){

// ---------- the player ----------
function useAction(){
  if(dead || ending || levelTransition > 0) return;
  const ca = Math.cos(player.angle), sa = Math.sin(player.angle);
  for(let s = 0.2; s <= 2.0; s += 0.1){
    const c = Math.floor(player.x + ca * s), r = Math.floor(player.y + sa * s);
    const d = doorAtCell(c, r);
    if(d){ if(d.state === 0 || d.state === 3) openDoor(d, 'use'); return; }
    if(isWall(c, r)){ AudioSys.play('useWall'); return; }
  }
}
function updatePlayer(){
  let f = 0, s = 0;
  if(attract){ f = botIn.f; s = botIn.s; }        // the title-screen bot drives
  else {
    if(keys.KeyW || keys.ArrowUp) f++;
    if(keys.KeyS || keys.ArrowDown) f--;
    if(keys.KeyD) s++;
    if(keys.KeyA) s--;
    if(keys.ArrowLeft) player.angle -= 0.045;
    if(keys.ArrowRight) player.angle += 0.045;
  }
  const ca = Math.cos(player.angle), sa = Math.sin(player.angle);
  let mx = f * ca - s * sa, my = f * sa + s * ca;
  const len = Math.hypot(mx, my); if(len > 1){ mx /= len; my /= len; }
  const SPEED = 0.058;
  player.vx += (mx * SPEED - player.vx) * 0.22;
  player.vy += (my * SPEED - player.vy) * 0.22;
  const nx = player.x + player.vx; let blocked = false;
  if(freeAt(nx, player.y, player.r)) player.x = nx; else { player.vx = 0; blocked = true; }
  const ny = player.y + player.vy;
  if(freeAt(player.x, ny, player.r)) player.y = ny; else { player.vy = 0; blocked = true; }
  // walking into a door opens it (locked doors tell you which key you need)
  if(blocked && len > 0.1){
    const d = doorAtCell(Math.floor(player.x + mx / len * 0.6), Math.floor(player.y + my / len * 0.6));
    if(d && (d.state === 0 || d.state === 3)) openDoor(d, 'player');
  }
  // monsters and barrels are solid
  for(const e of enemies){
    if(e.dead) continue;
    const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy), min = e.moveR + player.r + (e.type === 'spider' ? 0.5 : e.type === 'boss' || e.type === 'angel' ? 0.25 : 0.05);
    if(d < min && d > 0.001){
      const push = (min - d) * 0.5, px = player.x + dx / d * push, py = player.y + dy / d * push;
      if(freeAt(px, player.y, player.r)) player.x = px;
      if(freeAt(player.x, py, player.r)) player.y = py;
    }
  }
  const sp = Math.hypot(player.vx, player.vy);
  player.bobAmt += (Math.min(1, sp / SPEED) - player.bobAmt) * 0.15;
  const prev = player.bob;
  player.bob += sp * 2.6;
  if(Math.floor(prev / Math.PI) !== Math.floor(player.bob / Math.PI) && sp > 0.02) AudioSys.play('step');
  // damaging floors
  const ci = cellIdx(player.x, player.y);
  if(HAZ[ci]){
    if(player.hazT === 0) msg(T('l' + level + '_haz'), LSTYLE[level].hazMsg);
    if(++player.hazT % 30 === 1){ hurt(5, undefined, undefined, true); spawnSparks(player.x, player.y, 0.05, 8, LSTYLE[level].hazSpark, true); }
  } else player.hazT = 0;
}
function updateWeapon(){

  if(switchT > 0){
    switchT--;
    if(switchT === 7 && pendingWeapon >= 0){ weapon = pendingWeapon; pendingWeapon = -1; }
  }
  if(bfgCharge > 0){

    return;
  }

}

// ---------- monster movement helpers ----------
function tryMove(e, mx, my){
  let moved = false;
  const nx = e.x + mx; if(freeAt(nx, e.y, e.moveR)){ e.x = nx; moved = true; }
  const ny = e.y + my; if(freeAt(e.x, ny, e.moveR)){ e.y = ny; moved = true; }
  if(moved){ e.moving = true; e.anim += Math.hypot(mx, my) * 7; }
  return moved;
}
function moveToward(e, tx, ty, spd){
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  if(d < 0.001) return false;
  const s = Math.min(spd, d), x0 = e.x, y0 = e.y;
  tryMove(e, dx / d * s, dy / d * s);
  return Math.hypot(e.x - x0, e.y - y0) > s * 0.4;
}
function chase(e, spd, direct){
  if(direct && moveToward(e, player.x, player.y, spd)) return;
  const st = flowStep(e);
  if(st) moveToward(e, st[0], st[1], spd);
  else if(!direct) moveToward(e, player.x, player.y, spd);
}
function keepRange(e, dx, dy, dist, near, far, spd){
  if(dist > far) chase(e, spd, true);
  else if(dist < near) tryMove(e, -dx / dist * spd, -dy / dist * spd);
  else {
    if(--e.strafeT <= 0){ e.strafe *= -1; e.strafeT = 50 + Math.random() * 80; }
    if(!tryMove(e, -dy / dist * e.strafe * spd * 0.8, dx / dist * e.strafe * spd * 0.8)) e.strafe *= -1;
  }
}
function shootAt(e, kind, n, spread, speed, dmg){
  speed *= DCFG.proj;
  const base = Math.atan2(player.y - e.y, player.x - e.x);
  const z = e.fly ? e.fly + e.h * 0.4 : kind === 'imp' ? 0.62 : e.h * 0.45;
  for(let i = 0; i < n; i++){
    const a = base + (n > 1 ? (i / (n - 1) - 0.5) * 2 * spread : rand(-spread, spread));
    projectiles.push({ kind, x: e.x + Math.cos(a) * (e.hitR + 0.05), y: e.y + Math.sin(a) * (e.hitR + 0.05), z, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 300, dmg, ox: e.x, oy: e.y });
  }
  AudioSys.play(kind === 'laser' ? 'laser' : kind === 'acid' ? 'spit' : 'fireball', e.x, e.y);
}
function gunnerShot(e, dist){
  e.flashT = 4;
  AudioSys.play('rifle', e.x, e.y);
  const sp = Math.hypot(player.vx, player.vy);
  const p = clamp(0.7 - dist * 0.035 - sp * 5, 0.1, 0.75);
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  for(let s = 0.5; s < dist - 0.3; s += 0.6) particles.push({ x: e.x + Math.cos(a) * s, y: e.y + Math.sin(a) * s, z: 0.55, vx: 0, vy: 0, vz: 0, life: 3, max: 3, size: 0.03, r: 255, g: 230, b: 140, add: true, grav: 0 });
  if(e.los && Math.random() < p) hurt(3, e.x, e.y);
  else spawnDust(player.x + rand(-0.6, 0.6), player.y + rand(-0.6, 0.6), rand(0.1, 0.7), 2);
}

// ---------- monster AI ----------
function updateEnemies(){
  for(const e of enemies){
    if(e.dead) continue;
    if(e.type === 'barrel'){ if(e.fuse > 0 && --e.fuse === 0) killEnemy(e); continue; }
    if(e.hitFlash > 0) e.hitFlash--;
    if(e.shieldFlash > 0) e.shieldFlash--;
    if(e.flashT > 0) e.flashT--;
    if(e.blockT > 0) e.blockT--;
    if(e.burn > 0){                                   // on fire
      e.burn--;
      if(e.burn % 15 === 0){ damageEnemy(e, 0.22, e.x, e.y, 'fire'); if(e.dead) continue; }
      if(Math.random() < 0.5) particles.push({ x: e.x + rand(-0.2, 0.2), y: e.y + rand(-0.2, 0.2), z: e.fly + rand(0.1, e.h * 0.8), vx: 0, vy: 0, vz: rand(0.006, 0.014), life: rand(14, 26), max: 26, size: rand(0.05, 0.1), r: 255, g: rand(110, 190), b: 30, add: true, grav: -0.0004 });
    }
    const dx = player.x - e.x, dy = player.y - e.y, dist = Math.hypot(dx, dy) || 0.001;
    e.dist = dist;
    if(((tick + e.losTick) & 7) === 0) e.los = dist < 26 && losClear(e.x, e.y, player.x, player.y);
    e.moving = false;
    if(dead){ e.wind = 0; e.atk = 0; e.chargeT = 0; e.burst = 0; continue; }
    if(e.los && dist < e.sight) wake(e);
    if(!e.awake) continue;
    if(e.react > 0) e.react--;
    switch(e.type){
      case 'imp': {
        if(e.wind > 0){ if(--e.wind === 0 && e.los) shootAt(e, 'imp', 1, 0.06, 0.058, 12); break; }
        if(e.los && dist < 13){
          keepRange(e, dx, dy, dist, 3.3, 5.3, e.speed);
          if(--e.shootT <= 0 && e.react <= 0){ e.wind = 24; e.shootT = (95 + Math.random() * 75) * DCFG.cool; }
        } else chase(e, e.speed, false);
        break;
      }
      case 'gunner': {
        if(e.burst > 0){ if(--e.burstT <= 0){ gunnerShot(e, dist); e.burst--; e.burstT = 7; } break; }
        if(e.wind > 0){ if(--e.wind === 0 && e.los){ e.burst = 3; e.burstT = 0; } break; }
        if(e.los && dist < 16){
          keepRange(e, dx, dy, dist, 3.5, 8, e.speed);
          if(--e.shootT <= 0 && e.react <= 0){ e.wind = 26; e.shootT = (110 + Math.random() * 70) * DCFG.cool; }
        } else chase(e, e.speed, false);
        break;
      }
      case 'demon': case 'phantom': {
        if(e.type === 'phantom' && dist < 5 && ((tick + e.losTick * 13) % 75) === 0) AudioSys.play('whisper', e.x, e.y);
        const reach = e.moveR + player.r + 0.32;
        if(dist > reach) chase(e, e.speed, e.los && dist < 7);
        if(dist < reach + 0.2){
          e.atk++;
          if(e.atk >= (e.type === 'demon' ? 48 : 50)){ e.atk = 0; hurt(e.type === 'demon' ? 10 : 12, e.x, e.y); AudioSys.play('bite', e.x, e.y); }
        } else e.atk = Math.max(0, e.atk - 2);
        break;
      }
      case 'skull': {
        if(e.chargeT > 0){
          e.chargeT--;
          const ok = tryMove(e, e.vx, e.vy);
          e.anim += 0.5;
          if(Math.random() < 0.5) particles.push({ x: e.x, y: e.y, z: e.fly + 0.2, vx: 0, vy: 0, vz: 0.003, life: 14, max: 14, size: 0.06, r: 255, g: 140, b: 30, add: true, grav: 0 });
          if(dist < e.hitR + player.r + 0.15){ hurt(10, e.x, e.y); e.chargeT = 0; e.vx = 0; e.vy = 0; tryMove(e, -dx / dist * 0.4, -dy / dist * 0.4); AudioSys.play('bite', e.x, e.y); }
          else if(!ok) e.chargeT = 0;
          break;
        }
        if(e.wind > 0){
          if(--e.wind === 0){ e.vx = dx / dist * 0.11 * DCFG.proj; e.vy = dy / dist * 0.11 * DCFG.proj; e.chargeT = 45; AudioSys.play('skullCharge', e.x, e.y); }
          break;
        }
        if(e.los && dist < 8 && --e.shootT <= 0 && e.react <= 0){ e.wind = 28; e.shootT = (90 + Math.random() * 50) * DCFG.cool; AudioSys.play('skullScreech', e.x, e.y); }
        else if(dist > 2.5) chase(e, e.speed, e.los);
        break;
      }
      case 'bloat': {
        if(e.wind > 0){ if(--e.wind === 0 && e.los) shootAt(e, 'acid', 1, 0.05, 0.055, 10); break; }
        if(e.los && dist < 12){
          keepRange(e, dx, dy, dist, 3, 6, e.speed);
          if(--e.shootT <= 0 && e.react <= 0){ e.wind = 30; e.shootT = (140 + Math.random() * 60) * DCFG.cool; }
        } else chase(e, e.speed, false);
        break;
      }
      case 'drone': {
        if(e.wind > 0){ if(--e.wind === 0 && e.los) shootAt(e, 'laser', 1, 0.04, 0.12, 5); break; }
        if(e.los && dist < 14){
          if(e.strafeT > 40) e.strafeT = 30 + Math.random() * 30;
          keepRange(e, dx, dy, dist, 3.5, 7, e.speed);
          if(--e.shootT <= 0 && e.react <= 0){ e.wind = 14; e.shootT = (70 + Math.random() * 40) * DCFG.cool; }
        } else chase(e, e.speed, false);
        break;
      }
      case 'turret': {
        if(e.burst > 0){ if(--e.burstT <= 0){ e.flashT = 4; if(e.los) shootAt(e, 'laser', 1, 0.05, 0.11, 5); e.burst--; e.burstT = 8; } break; }
        if(e.wind > 0){ if(--e.wind === 0){ e.burst = 3; e.burstT = 0; } break; }
        if(e.los && dist < 15 && --e.shootT <= 0 && e.react <= 0){ e.wind = 20; e.shootT = (150 + Math.random() * 40) * DCFG.cool; AudioSys.play('turretBeep', e.x, e.y); }
        break;
      }
      case 'knight': {
        if(e.wind > 0){ if(--e.wind === 0 && e.los) shootAt(e, 'knight', 3, 0.2, 0.066, 12); break; }
        if(dist > 1.1) chase(e, e.speed, e.los && dist < 8);
        if(e.los && dist < 14 && --e.shootT <= 0 && e.react <= 0){ e.wind = 32; e.shootT = (190 + Math.random() * 60) * DCFG.cool; }
        if(dist < 1.3){ if(++e.atk > 50){ e.atk = 0; hurt(15, e.x, e.y); } } else e.atk = 0;
        break;
      }
      case 'boss': {
        if(e.wind > 0){
          if(--e.wind === 0){
            const exposed = e.phasesLeft === 0;
            shootAt(e, 'boss', exposed ? 5 : 3, exposed ? 0.36 : 0.25, 0.075, 18);
            AudioSys.play('boom', e.x, e.y); shake = Math.max(shake, 4);
          }
          break;
        }
        if(dist > 1.7) chase(e, e.speed, e.los && dist < 8);
        if(e.moving && Math.floor(e.anim / 2.2) !== Math.floor((e.anim - e.speed * 7) / 2.2)){ AudioSys.play('stomp', e.x, e.y); if(dist < 8) shake = Math.max(shake, 3 * (1 - dist / 8)); }
        if(--e.shootT <= 0 && e.los){ e.wind = 48; e.shootT = (e.phasesLeft === 0 ? 140 : 190) * DCFG.cool; AudioSys.play('bossWind', e.x, e.y); }
        if(e.phasesLeft === 0 && dist < 1.7){ if(++e.atk > 45){ e.atk = 0; hurt(20, e.x, e.y); AudioSys.play('stomp', e.x, e.y); shake = 10; } } else e.atk = 0;
        break;
      }
      case 'spider': updateSpider(e, dx, dy, dist); break;
      case 'angel': updateAngel(e, dx, dy, dist); break;
      case 'cherub': {
        // flutters around you, never still; the eye charges, then a burst of two bolts of light
        if(e.burst > 0 && --e.burstT <= 0){ if(e.los) shootAt(e, 'holy', 1, 0.05, 0.075, 7); e.burst--; e.burstT = 9; }
        if(e.wind > 0){ if(--e.wind === 0 && e.los){ e.burst = 2; e.burstT = 0; } break; }
        if(e.los && dist < 14){
          if(--e.strafeT <= 0){ e.strafe *= -1; e.strafeT = 30 + Math.random() * 50; }
          const want = dist > 6 ? 1 : dist < 3.5 ? -1 : 0, sp = e.speed;
          if(!tryMove(e, (dx / dist * want - dy / dist * e.strafe) * sp, (dy / dist * want + dx / dist * e.strafe) * sp)) e.strafe *= -1;
          if(--e.shootT <= 0 && e.react <= 0 && e.burst === 0){ e.wind = 18; e.shootT = (90 + Math.random() * 60) * DCFG.cool; AudioSys.play('cherub', e.x, e.y); }
        } else chase(e, e.speed, false);
        break;
      }
      case 'paladin': {
        // keeps its shield turned toward you (slowly — flank it); lowers it to throw a spear
        const want = Math.atan2(dy, dx), tr = 0.035 * DCFG.speed;
        if(e.wind <= 0) e.face += clamp(angleDiff(want, e.face), -tr, tr);
        e.guard = !(e.wind > 0 && e.atkKind === 'throw');
        if(e.wind > 0){
          if(--e.wind === 0){
            if(e.atkKind === 'stab'){ if(dist < 1.7){ hurt(14, e.x, e.y); AudioSys.play('bite', e.x, e.y); } }
            else if(e.los){ e.face = want; shootAt(e, 'spear', 1, 0.015, 0.12, 14); }
          }
          break;
        }
        if(dist < 1.4){ if(++e.atk > 45){ e.atk = 0; e.wind = 20; e.atkKind = 'stab'; AudioSys.play('swish', e.x, e.y); } break; }
        e.atk = 0;
        if(e.los && dist > 2.5 && dist < 13 && --e.shootT <= 0 && e.react <= 0){ e.wind = 34; e.atkKind = 'throw'; e.shootT = (170 + Math.random() * 60) * DCFG.cool; AudioSys.play('paladin', e.x, e.y); break; }
        chase(e, e.speed, e.los && dist < 8);
        break;
      }
    }
  }
  // keep monsters from stacking
  for(let i = 0; i < enemies.length; i++){
    const a = enemies[i]; if(a.dead) continue;
    for(let j = i + 1; j < enemies.length; j++){
      const b = enemies[j]; if(b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy, min = a.moveR + b.moveR;
      if(d2 < min * min && d2 > 1e-6){
        const d = Math.sqrt(d2), push = (min - d) * 0.25, ux = dx / d * push, uy = dy / d * push;
        const fa = a.speed === 0, fb = b.speed === 0;
        if(!fa && freeAt(a.x - ux * (fb ? 2 : 1), a.y - uy * (fb ? 2 : 1), a.moveR)){ a.x -= ux * (fb ? 2 : 1); a.y -= uy * (fb ? 2 : 1); }
        if(!fb && freeAt(b.x + ux * (fa ? 2 : 1), b.y + uy * (fa ? 2 : 1), b.moveR)){ b.x += ux * (fa ? 2 : 1); b.y += uy * (fa ? 2 : 1); }
      }
    }
  }
}
function updateSpider(e, dx, dy, dist){
  if(e.rushState === 0){
    e.rushT++;
    if(dist > 1.8) chase(e, e.speed, e.los && dist < 8);
    if(--e.shootT <= 0 && e.los){ shootAt(e, 'spider', 5, 0.35, 0.075, 15); e.shootT = 240 * DCFG.cool; shake = Math.max(shake, 3); }
    if(e.rushT >= 260 * DCFG.cool && e.los && dist < 14 && dist > 2.2){
      e.rushState = 1; e.rushT = 0;
      e.rushDir = [dx / dist, dy / dist];
      e.trail = []; let L = 0;
      while(L < 14){ L += 0.25; if(!freeAt(e.x + e.rushDir[0] * L, e.y + e.rushDir[1] * L, e.moveR)){ L -= 0.25; break; } }
      e.rushLen = L;
      for(let s = 1; s <= L; s += 0.8) e.trail.push([e.x + e.rushDir[0] * s, e.y + e.rushDir[1] * s]);
      AudioSys.play('spiderCharge', e.x, e.y);
    }
  } else if(e.rushState === 1){
    if(++e.rushT >= Math.round(80 * Math.max(0.7, DCFG.cool))){ e.rushState = 2; e.rushT = 0; e.rushStart = [e.x, e.y]; }
  } else if(e.rushState === 2){
    e.rushT++;
    const sp = 0.068 * DCFG.proj, x0 = e.x, y0 = e.y;
    tryMove(e, e.rushDir[0] * sp, e.rushDir[1] * sp);
    e.anim += 0.6;
    if(Math.hypot(player.x - e.x, player.y - e.y) < 1.3){
      hurt(25, e.x, e.y);
      player.vx += e.rushDir[0] * 0.2; player.vy += e.rushDir[1] * 0.2;
      e.rushState = 3; e.rushT = 0; shake = 14; AudioSys.play('stomp', e.x, e.y);
    } else if(Math.hypot(e.x - x0, e.y - y0) < sp * 0.3 || Math.hypot(e.x - e.rushStart[0], e.y - e.rushStart[1]) >= e.rushLen || e.rushT > 240){
      e.rushState = 3; e.rushT = 0; AudioSys.play('stomp', e.x, e.y);
      if(dist < 9) shake = Math.max(shake, 8);
      spawnDust(e.x + e.rushDir[0] * 0.8, e.y + e.rushDir[1] * 0.8, 0.2, 18);
    }
    e.trail = [];
  } else if(e.rushState === 3){
    if(++e.rushT >= 90){ e.rushState = 0; e.rushT = 0; }
  }
}

// ---------- projectiles ----------
const PROJ_COL = { imp: [255, 130, 20], boss: [255, 130, 20], knight: [110, 255, 60], spider: [80, 255, 140], acid: [170, 255, 40], laser: [255, 40, 40],
                   holy: [200, 255, 140], spear: [255, 240, 180], feather: [230, 255, 200] };
function updateProjectiles(){
  for(const p of projectiles){
    if(p.life <= 0) continue;
    p.x += p.vx; p.y += p.vy; p.life--;
    if(p.kind === 'flame'){
      const k = 1 - p.life / p.max;
      p.vx *= 0.95; p.vy *= 0.95; p.z += 0.003; p.r = 0.12 + k * 0.42;
      if(Math.random() < 0.55) particles.push({ x: p.x + rand(-0.1, 0.1), y: p.y + rand(-0.1, 0.1), z: p.z + rand(-0.08, 0.1), vx: p.vx * 0.3, vy: p.vy * 0.3, vz: rand(0.004, 0.012), life: rand(10, 20), max: 20, size: rand(0.06, 0.12) + k * 0.08, r: 255, g: rand(120, 210), b: rand(20, 70), add: true, grav: -0.0005 });
      if(isWallAt(p.x, p.y)){ p.x -= p.vx; p.y -= p.vy; p.vx = 0; p.vy = 0; if(p.life > 7) p.life = 7; }
      for(const e of enemies){
        if(e.dead || p.burnt.includes(e)) continue;
        if(Math.hypot(e.x - p.x, e.y - p.y) < e.hitR + p.r){ p.burnt.push(e); damageEnemy(e, 0.42, p.x, p.y, 'fire'); igniteEnemy(e); }
      }
      continue;
    }
    if(p.kind === 'bfg9'){
      if((tick & 1) === 0) particles.push({ x: p.x, y: p.y, z: p.z, vx: rand(-0.01, 0.01), vy: rand(-0.01, 0.01), vz: rand(-0.01, 0.01), life: 20, max: 20, size: 0.12, r: 100, g: 255, b: 130, add: true, grav: 0 });
      if(--p.zapT <= 0){                           // lightning at up to four enemies nearby
        p.zapT = 9;
        const near = enemies.filter(e => !e.dead && e.type !== 'barrel' && Math.hypot(e.x - p.x, e.y - p.y) < 6.5 && losClear(p.x, p.y, e.x, e.y))
          .sort((a, b) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y)).slice(0, 4);
        for(const e of near){ makeBolt(p.x, p.y, p.z, e.x, e.y, e.fly + e.h * 0.5); damageEnemy(e, 1.6, e.x, e.y, 'zap'); }
        if(near.length) AudioSys.play('zap', p.x, p.y);
      }
    }
    if(p.mine){
      if(p.kind === 'rocket' && (tick & 1) === 0){
        const v = rand(80, 130);
        particles.push({ x: p.x - p.vx * 2, y: p.y - p.vy * 2, z: p.z, vx: rand(-0.003, 0.003), vy: rand(-0.003, 0.003), vz: 0.004, life: 40, max: 40, size: 0.05, grow: 0.002, r: v, g: v, b: v, add: false, grav: -0.0001, smoke: true });
        particles.push({ x: p.x - p.vx, y: p.y - p.vy, z: p.z, vx: 0, vy: 0, vz: 0, life: 6, max: 6, size: 0.07, r: 255, g: 180, b: 60, add: true, grav: 0 });
      } else if((tick & 1) === 0){
        const col = p.kind === 'bfg' ? [60, 255, 90] : [200, 80, 255];
        particles.push({ x: p.x, y: p.y, z: p.z, vx: 0, vy: 0, vz: 0, life: 14, max: 14, size: p.kind === 'bfg' ? 0.1 : 0.05, r: col[0], g: col[1], b: col[2], add: true, grav: 0 });
      }
      let hit = null;
      for(const e of enemies){ if(!e.dead && Math.hypot(e.x - p.x, e.y - p.y) < e.hitR + 0.1){ hit = e; break; } }
      if(hit || isWallAt(p.x, p.y) || p.life <= 0){
        if(!hit){ p.x -= p.vx; p.y -= p.vy; }
        if(p.kind === 'plasma') plasmaExplode(p, hit);
        else if(p.kind === 'rocket'){ if(hit) damageEnemy(hit, 3, p.x, p.y); explode(p.x, p.y, 2.2, 6, 32); stats.hits++; }
        else if(p.kind === 'bfg') bfgExplode(p, hit);
        else if(p.kind === 'bfg9') bfg9Explode(p, hit);
        p.life = 0;
      }
      continue;
    }
    const col = PROJ_COL[p.kind] || [255, 130, 20];
    if((tick & 3) === 0) particles.push({ x: p.x, y: p.y, z: p.z, vx: rand(-0.004, 0.004), vy: rand(-0.004, 0.004), vz: 0.004, life: 18, max: 18, size: 0.05, r: col[0], g: col[1], b: col[2], add: true, grav: 0 });
    if(isWallAt(p.x, p.y)){
      p.x -= p.vx; p.y -= p.vy;
      spawnSparks(p.x, p.y, p.z, 14, col, true);
      AudioSys.play(p.kind === 'laser' ? 'metalHit' : 'boom', p.x, p.y); p.life = 0; continue;
    }
    // enemy fire can set off barrels
    for(const e of enemies){ if(!e.dead && e.type === 'barrel' && Math.hypot(e.x - p.x, e.y - p.y) < e.hitR){ damageEnemy(e, 2, p.x, p.y); p.life = 0; break; } }
    if(p.life <= 0) continue;
    if(!dead && Math.hypot(p.x - player.x, p.y - player.y) < 0.32){
      spawnSparks(p.x, p.y, p.z, 18, col, true);
      hurt(p.dmg, p.ox, p.oy); AudioSys.play('boom', p.x, p.y); p.life = 0;
    }
  }
  projectiles = projectiles.filter(p => p.life > 0);
}
function plasmaExplode(p, direct){
  spawnSparks(p.x, p.y, p.z, 30, [200, 60, 255], true);
  flashes.push({ x: p.x, y: p.y, z: p.z, R: 0.6, r: 200, g: 80, b: 255, life: 8, max: 8 });
  AudioSys.play('plasmaBoom', p.x, p.y);
  let any = false;
  if(direct){ damageEnemy(direct, 2, p.x, p.y); any = true; }
  for(const e of enemies){
    if(e.dead) continue;
    const d = Math.hypot(e.x - p.x, e.y - p.y), R = 1.6 + e.hitR * 0.5;
    if(d < R && losClear(p.x, p.y, e.x, e.y)){ damageEnemy(e, 1.5 * (1 - d / R * 0.5), e.x, e.y); any = true; }
  }
  if(any) stats.hits++;
}
function bfgExplode(p, direct){
  spawnSparks(p.x, p.y, p.z, 90, [60, 255, 90], true);
  flashes.push({ x: p.x, y: p.y, z: 0.5, R: 3, r: 80, g: 255, b: 100, life: 30, max: 30 });
  if(direct) damageEnemy(direct, 6, p.x, p.y);
  explode(p.x, p.y, 3.2, 10, 0, { green: true });
  // the Devastator's spray: everything in front of you takes a hit
  for(const e of enemies){
    if(e.dead || e.type === 'barrel') continue;
    const dx = e.x - player.x, dy = e.y - player.y, d = Math.hypot(dx, dy);
    if(d > 15 || Math.abs(angleDiff(Math.atan2(dy, dx), player.angle)) > 0.75 || !losClear(player.x, player.y, e.x, e.y)) continue;
    damageEnemy(e, 5, e.x, e.y);
    spawnSparks(e.x, e.y, e.fly + e.h * 0.5, 16, [60, 255, 90], true);
  }
  screenFlashColor = '60,255,90'; screenFlash = 35; shake = Math.max(shake, 10);
  AudioSys.play('bfgBoom', p.x, p.y);
  stats.hits++;
}

// ---------- particles ----------
function spawnBlood(x, y, z, n, ecto, acid){
  for(let i = 0; i < n; i++){
    const a = Math.random() * TAU, s = rand(0.008, 0.045), dark = Math.random() < 0.4;
    let r = dark ? 110 : 190, g = 0, b = 0;
    if(ecto){ r = 40; g = dark ? 140 : 255; b = dark ? 80 : 140; }
    else if(acid){ r = dark ? 120 : 190; g = dark ? 140 : 210; b = 30; }
    particles.push({ x, y, z: z + rand(-0.1, 0.1), vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: rand(0.005, 0.045), life: rand(40, 90), max: 90, size: rand(0.025, 0.06), r, g, b, add: !!ecto, grav: 0.0035 });

// ---------- one fixed 60 Hz simulation step ----------
function update(){
  tick++; gTime += 1 / 60;
  if(screenFlash > 0) screenFlash--;
  if(damageFlash > 0) damageFlash--;
  if(shieldBreakFlash > 0) shieldBreakFlash--;
  if(gunFlash > 0) gunFlash--;
  if(hitMarker > 0) hitMarker--;
  if(killMarker > 0) killMarker--;
  if(bossBanner > 0) bossBanner--;
  if(levelBanner > 0) levelBanner--;
  if(pickupFlash > 0) pickupFlash--;
  recoil *= 0.82; shake *= 0.86; if(shake < 0.1) shake = 0;
  vmTick();
  damageDirs = damageDirs.filter(d => --d.t > 0);
  messages = messages.filter(m => --m.t > 0);
  updateFace();
  if(levelTransition > 0){
    levelTransition--; updateParticles();
    if(levelTransition === 0) startLevel(level + 1, true);
    return;
  }
  if(ending){ updateEnding(); updateParticles(); return; }
  if(dead) deathTimer++;
  else { stats.time += 1 / 60; updatePlayer(); updateWeapon(); }
  updateDoors();
  updateFlow(false);
  updateEnemies();
  updateProjectiles();
  if(pillars.length) updatePillars();
  ambientParticles();
  updateParticles();
  if(!dead) checkPickups();
  if(tick % 120 === 0) enemies = enemies.filter(e => !e.dead);
}

// ============================================================
// 3D RENDERER — textured raycaster drawn straight into a pixel buffer
// ============================================================
const gctx = gameCanvasEl.getContext('2d', { alpha: false });
let gW = 640, gH = 360, VIEW_H = 288, HUD_H = 72, HZ = 144, U = 1;
let img = null, buf32 = null, zBuf = null, PROJ_X = 1, H_SCALE = 1;
const FOV = 1.15, TAN_HALF = Math.tan(FOV / 2);
let skyPx = null, skyH = 0, skyCol = null, rowDist = null, rowL = null, skyEnd = null, floorStart = null;
let needsRender = false, frameNo = 0, resizeTimer = null;
let lastFrame = 0, acc = 0;
let dirX = 1, dirY = 0, planeX = 0, planeY = TAN_HALF, eyeZ = 0.5, invDet = 1;
const LUT_N = 1024;
const lightLUT = new Uint16Array(LUT_N);
const fogR = new Uint8Array(257), fogG = new Uint8Array(257), fogB = new Uint8Array(257);

function scheduleResize(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(setupResolution, 150); }
function setupResolution(){
  const aspect = clamp(window.innerWidth / Math.max(1, window.innerHeight), 1.25, 2.4);
  gH = attract ? Math.min(settings.resH, 480) : settings.resH; gW = Math.round(gH * aspect / 2) * 2;
  gameCanvasEl.width = gW; gameCanvasEl.height = gH;
  U = gH / 360;
  setupHud();
  if(attract) HUD_H = 0;
  VIEW_H = gH - HUD_H; HZ = VIEW_H >> 1;
  img = gctx.createImageData(gW, VIEW_H); buf32 = new Uint32Array(img.data.buffer);
  zBuf = new Float32Array(gW); skyCol = new Int32Array(gW); skyEnd = new Int16Array(gW); floorStart = new Int16Array(gW);
  rowDist = new Float32Array(VIEW_H); rowL = new Uint16Array(VIEW_H);
  PROJ_X = (gW / 2) / TAN_HALF; H_SCALE = PROJ_X * 0.85;
  const sw = window.innerWidth, sh = window.innerHeight;
  let cw = sw, ch = sw * gH / gW; if(ch > sh){ ch = sh; cw = sh * gW / gH; }
  gameCanvasEl.style.width = Math.floor(cw) + 'px'; gameCanvasEl.style.height = Math.floor(ch) + 'px';
  gctx.imageSmoothingEnabled = false;
  if(MAP) buildSkyForLevel();
  needsRender = true;
}
const SKY_CACHE = {};      // the sky only depends on the level and the view height
function buildSkyForLevel(){ skyH = HZ; const k = level + ':' + skyH; skyPx = SKY_CACHE[k] || (SKY_CACHE[k] = buildSky(level, skyH)); }
function prepareLighting(){
  const fog = TEXSETS[level].fog, mix = 0.85;
  for(let L = 0; L <= 256; L++){
    const k = (256 - L) / 256 * mix;
    fogR[L] = fog[0] * k; fogG[L] = fog[1] * k; fogB[L] = fog[2] * k;
  }
  const flash = gunFlash > 0 ? Math.min(1, gunFlash / 5) : 0;
  const st = LSTYLE[level], amb = st.amb, f1 = st.fall[0], f2 = st.fall[1];
  for(let i = 0; i < LUT_N; i++){
    const d = i / 16;
    let L = 256 / (1 + d * f1 + d * d * f2);
    if(flash) L += flash * 150 * Math.max(0, 1 - d / 7);
    lightLUT[i] = Math.min(256, Math.max(amb, L)) | 0;
  }
}
function lightAtDist(d){ const i = (d * 16) | 0; return lightLUT[i < LUT_N ? i : LUT_N - 1]; }
function addMapLight(L, x, y, flick){
  const lx = (x * LMS) | 0, ly = (y * LMS) | 0;
  if(lx < 0 || ly < 0 || lx >= LMW || ly >= LMH) return L;
  const lm = (LIGHTMAP[ly * LMW + lx] * flick) >> 8;
  L += (lm * (300 - L)) >> 8;
  return L > 256 ? 256 : L;
}

// ---------- the frame ----------
function render(){
  if(!buf32 || !MAP) return;
  frameNo++;
  const ts = TEXSETS[level], W = gW, VH = VIEW_H, B = buf32;
  prepareLighting();
  const ang = player.angle;
  dirX = Math.cos(ang); dirY = Math.sin(ang); planeX = -dirY * TAN_HALF; planeY = dirX * TAN_HALF;
  invDet = 1 / (planeX * dirY - dirX * planeY);
  eyeZ = 0.5 - Math.abs(Math.sin(player.bob)) * 0.022 * player.bobAmt;
  if(dead) eyeZ = lerp(0.5, 0.1, Math.min(1, deathTimer / 35));
  const px = player.x, py = player.y;
  const flick = 205 + ((Math.sin(gTime * 13) * Math.sin(gTime * 7.3) + 1) * 25) | 0;

  for(let y = HZ + 1; y < VH; y++){
    const rd = eyeZ * H_SCALE / (y + 0.5 - HZ);
    rowDist[y] = rd; rowL[y] = lightAtDist(rd);
  }
  const skyScale = SKY_W * 2 / TAU;
  for(let x = 0; x < W; x++){
    const a = ang + Math.atan((x * 2 / W - 1) * TAN_HALF);
    skyCol[x] = (((a * skyScale) % SKY_W) + SKY_W) % SKY_W | 0;
  }
  const sky = skyPx, sOff = (skyH - HZ) * SKY_W;
  const walls = ts.walls, floors = ts.floors;

  const doorTex = ts.doors, jambTex = ts.jamb, cracked = ts.cracked;
  for(let x = 0; x < W; x++){
    const camX = x * 2 / W - 1;
    const rdx = dirX + planeX * camX, rdy = dirY + planeY * camX;
    let mapX = px | 0, mapY = py | 0;
    const ddx = rdx === 0 ? 1e30 : Math.abs(1 / rdx), ddy = rdy === 0 ? 1e30 : Math.abs(1 / rdy);
    let stepX, stepY, sdx, sdy;
    if(rdx < 0){ stepX = -1; sdx = (px - mapX) * ddx; } else { stepX = 1; sdx = (mapX + 1 - px) * ddx; }
    if(rdy < 0){ stepY = -1; sdy = (py - mapY) * ddy; } else { stepY = 1; sdy = (mapY + 1 - py) * ddy; }
    let side = 0, cell = -1, door = null, doorT = 0, doorU = 0, lastDoor = 0, tex = null;
    SEEN[mapY * MCOLS + mapX] = 1;
    for(let i = 0; i < 220; i++){
      if(sdx < sdy){ sdx += ddx; mapX += stepX; side = 0; } else { sdy += ddy; mapY += stepY; side = 1; }
      if(mapX < 0 || mapY < 0 || mapX >= MCOLS || mapY >= MROWS) break;
      const ci = mapY * MCOLS + mapX, m = MAP[ci];
      SEEN[ci] = 1;
      if(m === 0){ lastDoor = 0; continue; }
      if(m === 1){
        cell = ci;
        tex = (lastDoor === 1 && side === 0) || (lastDoor === 2 && side === 1) ? jambTex : CELLTEX[ci];
        break;
      }
      const d = DOORS[DOORAT[ci]];
      if(d.secret){ cell = ci; tex = cracked[WT[ci]]; break; }
      const tEnter = side === 0 ? sdx - ddx : sdy - ddy, tExit = sdx < sdy ? sdx : sdy;
      let t, u;
      if(d.axis === 'h'){ t = rdy !== 0 ? (mapY + 0.5 - py) / rdy : 1e30; u = px + t * rdx - mapX; }
      else { t = rdx !== 0 ? (mapX + 0.5 - px) / rdx : 1e30; u = py + t * rdy - mapY; }
      if(t >= tEnter && t <= tExit && u >= d.open){

    const top = HZ - (1 - eyeZ) * lineH, bot = HZ + eyeZ * lineH;
    const y0 = Math.max(0, Math.ceil(top)), y1 = Math.min(VH, Math.ceil(bot));
    skyEnd[x] = Math.min(y0, HZ);
    floorStart[x] = y1 < HZ + 1 ? HZ + 1 : y1;
    let idx;
    // wall / door column
    if(cell >= 0 && y1 > y0){
      const tpx = tex.px, tem = tex.em;
      let texX;
      if(door) texX = (doorU * 64) | 0;
      else {
        let wallX = side === 0 ? py + perp * rdy : px + perp * rdx;
        wallX -= Math.floor(wallX);
        texX = (wallX * 64) | 0;
        if((side === 0 && rdx < 0) || (side === 1 && rdy > 0)) texX = 63 - texX;
      }
      texX &= 63;
      let L = lightAtDist(perp);
      if(side === 1) L = (L * 205) >> 8;
      const hx = px + perp * rdx - (!door && side === 0 ? stepX * 0.04 : 0), hy = py + perp * rdy - (!door && side === 1 ? stepY * 0.04 : 0);
      L = addMapLight(L, hx, hy, flick);
      const fr = fogR[L], fg = fogG[L], fb = fogB[L];
      const step = 64 / lineH;
      let tp = (y0 - top) * step;
      idx = y0 * W + x;
      for(let y = y0; y < y1; y++){
        const ti = (((tp | 0) & 63) << 6) | texX; tp += step;
        const c = tpx[ti];
        if(tem[ti]){
          const e = tem[ti] > L ? tem[ti] : L;
          B[idx] = 0xff000000 | ((((c >> 16) & 255) * e >> 8) + fogB[e]) << 16 | ((((c >> 8) & 255) * e >> 8) + fogG[e]) << 8 | (((c & 255) * e >> 8) + fogR[e]);
        } else {
          B[idx] = 0xff000000 | ((((c >> 16) & 255) * L >> 8) + fb) << 16 | ((((c >> 8) & 255) * L >> 8) + fg) << 8 | (((c & 255) * L >> 8) + fr);
        }
        idx += W;
      }
    }
  }

  // ceilings indoors, open sky outdoors — row by row
  const ldx = dirX - planeX, ldy = dirY - planeY, k2 = 2 / W;
  const cpx = ts.ceil.map(t => t.px), cem = ts.ceil.map(t => t.em), ch = 1 - eyeZ;
  for(let y = 0; y < HZ; y++){

      if(y >= skyEnd[x]) continue;
      const cx = fx | 0, cy = fy | 0;

    for(let x = 0; x < W; x++, idx++, fx += sx, fy += sy){

      let L = L0;
      const lmv = LIGHTMAP[((fy * LMS) | 0) * LMW + ((fx * LMS) | 0)];

    const barCol = phase < 3 ? PHASE_COLORS[phase] : (boss.hitFlash > 0 ? '#fff' : '#ff4400');
    const pct = phase < 3 ? boss.shield / boss.shieldMax : boss.hp / boss.maxHp;
    c.fillStyle = 'rgba(0,0,0,0.8)'; c.fillRect(barX - 2, barY - 2, barW + 4, bh + 4);
    c.fillStyle = barCol; c.fillRect(barX, barY, Math.floor(barW * clamp(pct, 0, 1)), bh);
    for(let p = 0; p < 3; p++){ c.fillStyle = p < phase ? '#333' : PHASE_COLORS[p]; c.fillRect(barX + Math.floor(barW * p / 3) + 2, barY + bh + 3, Math.floor(barW / 3) - 4, Math.max(2, Math.round(2 * U))); }
    c.strokeStyle = barCol; c.lineWidth = 1; c.strokeRect(barX, barY, barW, bh);
    c.globalAlpha = 0.8 + 0.2 * Math.sin(t * 4);
    pixelText(c, `${T(LSTYLE[level].bossName)} - ${T('phase' + phase)}`, W / 2, barY - 5 * s - 2, s, barCol, 'center');
    c.globalAlpha = 1;
    if(boss.type === 'spider' && boss.rushState === 1){

      pixelText(c, T('charge'), W / 2, barY + bh + 12 * U, s + 1, '#ff5500', 'center'); c.globalAlpha = 1;
    }
  }

  // --- full-screen flashes ---
  const nearFire = projectiles.some(p => !p.mine && Math.hypot(p.x - player.x, p.y - player.y) < 2.5);
  if(nearFire){ c.globalAlpha = 0.07 + 0.05 * Math.sin(t * 20); c.fillStyle = '#ff6600'; c.fillRect(0, 0, W, VH); c.globalAlpha = 1; }
  if(player && HAZ[cellIdx(player.x, player.y)] && !dead){ c.globalAlpha = 0.12 + 0.06 * Math.sin(t * 9); c.fillStyle = LSTYLE[level].haz; c.fillRect(0, 0, W, VH); c.globalAlpha = 1; }
  const fk = attract ? 0.35 : 1;      // behind the title menu: softer flashes
  if(shieldBreakFlash > 0){ c.globalAlpha = fk * shieldBreakFlash / 70; c.fillStyle = '#00cfff'; c.fillRect(0, 0, W, VH); c.globalAlpha = 1; }
  if(pickupFlash > 0){ c.globalAlpha = fk * pickupFlash / 30; c.fillStyle = '#ffe080'; c.fillRect(0, 0, W, VH); c.globalAlpha = 1; }
  if(screenFlash > 0){ c.globalAlpha = fk * Math.min(0.6, screenFlash / 40); c.fillStyle = `rgb(${screenFlashColor})`; c.fillRect(0, 0, W, VH); c.globalAlpha = 1; }
  if(damageFlash > 0 || (hp <= 25 && !dead)){
    const k = fk * (damageFlash > 0 ? Math.min(0.7, damageFlash / 30) : 0.18 + 0.1 * Math.sin(t * 5));
    const g = c.createRadialGradient(W / 2, HZ, VH * 0.2, W / 2, HZ, W * 0.6);
    g.addColorStop(0, 'rgba(180,0,0,0)'); g.addColorStop(1, `rgba(200,0,0,${k})`);
    c.fillStyle = g; c.fillRect(0, 0, W, VH);

  for(const d of damageDirs){
    const rel = angleDiff(d.a, player.angle), R = Math.min(W, VH) * 0.3;
    c.strokeStyle = `rgba(255,30,0,${Math.min(0.85, d.t / 40)})`; c.lineWidth = 5 * U;
    c.beginPath(); c.arc(W / 2, HZ, R, rel - Math.PI / 2 - 0.32, rel - Math.PI / 2 + 0.32); c.stroke();

  if(attract){ if(!dead) drawWeapon(); drawAttractFx(); return; }   // title demo: just the game, no HUD or text

  if(!dead && !ending) drawWeapon();
  if(!dead && !ending && levelTransition === 0) drawCrosshair();
  drawMessages();
  drawBanners();
  renderMinimap();
  renderHUD();

  // level badge, timer, tally
  const bx = Math.round(5 * U), by = Math.round(5 * U);
  const lab = boss && bossAwake && !boss.dead ? T('badge_short', level, fmtTime(stats.time)) : T('badge', level, fmtTime(stats.time), kills, killTotal, secretsFound, secretTotal);
  c.fillStyle = 'rgba(0,0,0,0.5)'; c.fillRect(bx - 2, by - 2, badgeW + 4 + s, 5 * s + 4 + s);
  badgeW = pixelText(c, lab, bx, by, s, LSTYLE[level].badge);
  // keys you hold, under the badge
  ['red', 'yellow', 'blue'].forEach((k, i) => {
    if(!keysHeld[k]) return;
    const kx = bx + i * 10 * s, ky = by + 8 * s;
    c.fillStyle = KEYCOL[k]; c.fillRect(kx, ky, 3 * s, 3 * s); c.fillRect(kx + 3 * s, ky + s, 4 * s, s); c.fillRect(kx + 5 * s, ky + 2 * s, s, 2 * s);
  });

  if(document.pointerLockElement !== gameCanvasEl && !dead && !ending && levelTransition === 0){
    c.globalAlpha = 0.55 + 0.35 * Math.sin(t * 3);
    pixelText(c, T('click_aim'), W / 2, boss && bossAwake && !boss.dead ? 52 * U : 22 * U, s, '#ffcc66', 'center');

}

// ---------- first-person weapon: the 3D model itself is drawn into the frame (07f/07g); here go its glows and flashes ----------
function drawWeapon(){
  const c = gctx, Wp = WEAPONS[weapon], spec = VM.models && VM.models[weapon];
  c.save();
  c.globalCompositeOperation = 'lighter';
  const glowAt = (x, y, R, c0, c1, c2, a) => {
    if(R < 0.5 || a <= 0) return;
    c.globalAlpha = Math.min(1, a);
    const g = c.createRadialGradient(x, y, 0, x, y, R); g.addColorStop(0, c0); g.addColorStop(0.4, c1); g.addColorStop(1, c2);
    c.fillStyle = g; c.beginPath(); c.arc(x, y, R, 0, TAU); c.fill();
  };
  if(weapon === 5){ const pulse = 0.55 + 0.45 * Math.sin(gTime * 8); for(const [x, y, f, r] of VM.glowPts) glowAt(x, y, r * f * 1.5, '#ffffff', '#c050ff', 'rgba(140,0,255,0)', 0.32 * pulse); }
  if(weapon === 6){
    const charge = bfgCharge > 0 ? 1 - bfgCharge / 34 : 0, pulse = 0.5 + 0.5 * Math.sin(gTime * (6 + charge * 20));
    for(const [x, y, f, r] of VM.glowPts) glowAt(x, y, r * f * (1.1 + charge * 2.2), '#ffffff', '#60ff80', 'rgba(0,255,60,0)', (0.3 + charge * 0.6) * (0.6 + 0.4 * pulse));
  }
  if(weapon === 8){
    const charge = bfgCharge > 0 ? 1 - bfgCharge / 50 : 0, pulse = 0.55 + 0.45 * Math.sin(gTime * (5 + charge * 25));
    for(const [x, y, f, r] of VM.glowPts){
      const R = r * f * (1 + charge * 1.3) * (0.85 + 0.15 * pulse);
      glowAt(x, y, R, '#ffffff', '#80ff90', 'rgba(0,255,60,0)', 0.4 + 0.5 * charge);
      if(charge > 0) for(let k = 0; k < 4; k++){
        c.globalAlpha = 0.6 * charge; c.strokeStyle = 'rgba(190,255,200,1)'; c.lineWidth = Math.max(1, 1.5 * U);
        const a0 = Math.random() * TAU; let px = x + Math.cos(a0) * R * 0.25, py = y + Math.sin(a0) * R * 0.25;
        c.beginPath(); c.moveTo(px, py);
        for(let s2 = 1; s2 <= 4; s2++){ const rr = R * (0.25 + s2 * 0.2), aa = a0 + (Math.random() - 0.5) * 0.9; c.lineTo(x + Math.cos(aa) * rr, y + Math.sin(aa) * rr); }
        c.stroke();
      }
    }
  }
  if(weapon === 7 && VM.pilot && VM.mz.length){                 // flamethrower: blue pilot light, and a tongue of fire while firing
    const on = firing() && canFire(7) && switchT === 0, [mx, my, f] = VM.mz[0], [px, py, pf] = VM.pilot;
    glowAt(px, py, (0.009 + 0.002 * Math.sin(gTime * 30)) * pf, '#e0f0ff', '#4080ff', 'rgba(0,40,255,0)', 0.85);
    if(on){ const R = (0.05 + Math.random() * 0.015) * f; glowAt(mx, my - R * 0.25, R, '#fff6c0', '#ffa030', 'rgba(255,60,0,0)', 0.9); }
  }
  if(gunFlash > 0 && spec && spec.flashR && weapon !== 7){
    const maxF = weapon === 2 ? 4 : weapon === 3 ? 7 : weapon >= 6 ? (weapon === 8 ? 12 : 10) : 6, k = Math.min(1, gunFlash / maxF);
    const cols = weapon === 5 ? ['#ffffff', '#ee88ff', 'rgba(170,0,255,0)'] : weapon >= 6 ? ['#ffffff', '#80ff90', 'rgba(0,255,60,0)'] : ['#ffffff', '#ffd060', 'rgba(255,120,0,0)'];
    for(const [cx, cy, f] of VM.mz){
      const R = spec.flashR * f * (0.6 + 0.4 * k);
      glowAt(cx, cy, R, cols[0], cols[1], cols[2], k * 1.2);
      c.strokeStyle = cols[1]; c.lineWidth = Math.max(1, 2 * U);
      for(let r2 = 0; r2 < 7; r2++){ const a = r2 / 7 * TAU + gTime * 3; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(a) * R * 1.3, cy + Math.sin(a) * R * 1.1); c.stroke(); }
    }
  }
  c.restore();
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  // ammo warnings
  if(Wp.ammo && !attract){
    const am = ammo[Wp.ammo], low = { bul: 20, shl: 5, rkt: 3, cel: weapon === 6 ? 80 : 20 }[Wp.ammo], s = PS();
    if(am < Wp.cost){ c.globalAlpha = 0.7 + 0.3 * Math.sin(gTime * 8); pixelText(c, T('empty_q', wName(weapon)), gW / 2, VIEW_H - 112 * U, s, '#ff2200', 'center'); c.globalAlpha = 1; }
    else if(am <= low){ c.globalAlpha = 0.7 + 0.3 * Math.sin(gTime * 6); pixelText(c, T('low_ammo', am), gW / 2, VIEW_H - 112 * U, s, '#ff8800', 'center'); c.globalAlpha = 1; }
  }
}

function drawCrosshair(){
  const c = gctx, chX = gW / 2, chY = HZ, u = U;
  c.lineWidth = Math.max(1, 1.4 * u);
  if(weapon === 5 || weapon === 6 || weapon === 8){
    const cr = (12 + 3 * Math.sin(gTime * 6)) * u * (weapon === 8 ? 2 : weapon === 6 ? 1.5 : 1);
    c.strokeStyle = weapon >= 6 ? 'rgba(60,255,90,0.85)' : 'rgba(200,0,255,0.85)';
    c.beginPath(); c.arc(chX, chY, cr, 0, TAU); c.stroke();
    c.beginPath(); c.moveTo(chX - 5 * u, chY); c.lineTo(chX + 5 * u, chY); c.moveTo(chX, chY - 5 * u); c.lineTo(chX, chY + 5 * u); c.stroke();
  } else if(weapon === 3){
    const sp = 26 * u, gap = 8 * u, L = 8 * u, k = 6 * u;
    c.strokeStyle = 'rgba(255,140,0,0.88)'; c.beginPath();
    for(const sx of [-1, 1]) for(const sy of [-1, 1]){ c.moveTo(chX + sx * sp, chY + sy * gap); c.lineTo(chX + sx * sp, chY + sy * (gap + L)); c.lineTo(chX + sx * (sp - k), chY + sy * (gap + L)); }
    c.stroke();
    c.fillStyle = 'rgba(255,140,0,0.9)'; c.beginPath(); c.arc(chX, chY, 2.5 * u, 0, TAU); c.fill();
  } else if(weapon === 4){
    c.strokeStyle = 'rgba(230,210,90,0.9)';
    c.beginPath(); c.moveTo(chX - 14 * u, chY - 4 * u); c.lineTo(chX - 14 * u, chY + 4 * u); c.moveTo(chX + 14 * u, chY - 4 * u); c.lineTo(chX + 14 * u, chY + 4 * u);
    c.moveTo(chX - 6 * u, chY + 9 * u); c.lineTo(chX, chY + 4 * u); c.lineTo(chX + 6 * u, chY + 9 * u); c.stroke();
  } else if(weapon <= 1){
    c.fillStyle = 'rgba(255,255,255,0.7)'; c.fillRect(chX - u, chY - u, 2 * u, 2 * u);
  } else {
    const spread = (4 + recoil * 0.8) * u;
    c.strokeStyle = 'rgba(255,60,60,0.9)'; c.beginPath();
    c.moveTo(chX - 10 * u - spread, chY); c.lineTo(chX - spread, chY); c.moveTo(chX + spread, chY); c.lineTo(chX + 10 * u + spread, chY);
    c.moveTo(chX, chY - 10 * u - spread); c.lineTo(chX, chY - spread); c.moveTo(chX, chY + spread); c.lineTo(chX, chY + 10 * u + spread);
    c.stroke();
    c.fillStyle = 'rgba(255,60,60,0.9)'; c.beginPath(); c.arc(chX, chY, 1.6 * u, 0, TAU); c.fill();
  }
  if(hitMarker > 0 || killMarker > 0){
    const k = killMarker > 0 ? killMarker / 14 : hitMarker / 8, r1 = 5 * u, r2 = (11 + (killMarker > 0 ? 3 : 0)) * u;
    c.globalAlpha = k; c.strokeStyle = killMarker > 0 ? '#ff2020' : '#ffffff'; c.lineWidth = Math.max(1, 2 * u);
    c.beginPath();
    for(const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]){ c.moveTo(chX + sx * r1, chY + sy * r1); c.lineTo(chX + sx * r2, chY + sy * r2); }
    c.stroke(); c.globalAlpha = 1;
  }
}

function vmTick(){

  VM.lean = (VM.lean || 0) + (clamp(-lat * 3, -0.08, 0.08) - (VM.lean || 0)) * 0.12;
  if(weapon !== VM.lastW){ VM.lastW = weapon; VM.shotT = 99; }

  if(gunFlash > VM.lastFlash){
    VM.shotT = 0;

  }
  VM.lastFlash = gunFlash;
  if(VM.shotT < 99) VM.shotT++;

function vmEject(mesh, s){

                    rx: Math.random() * 3, ry: Math.random() * 3, rvx: 0.3 + Math.random() * 0.3, rvy: 0.2 + Math.random() * 0.3, life: 40 });
}

// ---------- posing ----------
function vmWeaponMatrix(spec){

  let y = pl[1] - Math.abs(Math.cos(player.bob)) * 0.008 * amt + VM.sway[1];

// ---------- one scene: a random level, difficulty and spot near some demons ----------
function attractScene(){

  if(ATT.levels.length && ATT.levels[ATT.levels.length - 1] === lv && Math.random() < 0.7) lv = lv % LAST_LEVEL + 1;   // mostly a different place each time
  ATT.levels.push(lv); if(ATT.levels.length > 4) ATT.levels.shift();

  level = lv;

  boss = null; bossAwake = false; bossBanner = 0;

    for(let k = 0; k < 14 && pool.length && !spot; k++){

// a free cell `dmin..dmax` steps from `anchor`, preferring ones that can see it
function attractSpot(anchor, dmin, dmax){
  botBFS(cellIdx(anchor.x, anchor.y), false);
  const cands = [];
  for(let i = 0; i < MAP.length; i++){
    const d = botDist[i];
    if(d < dmin || d > dmax || MAP[i] !== 0 || HAZ[i]) continue;
    const r = (i / MCOLS) | 0, c = i - r * MCOLS, x = c + 0.5, y = r + 0.5;

      const ed = Math.hypot(e.x - x, e.y - y);

function attractStep(){

  else if(!enemies.some(e => !e.dead && e.type !== 'barrel')) attractCut(60, 'clear');
  else if(ATT.t - BOT.seen > 60 * 9) attractCut(0, 'idle');                          // nothing happening: move on
  else if(ATT.t > ATT.len && ATT.t - BOT.seen > 90) attractCut(0, 'time');          // long enough: cut at a lull
  else if(ATT.t > ATT.len + 60 * 12) attractCut(0, 'time');

}

  if(has(8) && (big || crowd >= 3) && d > 5.5 && BOT.bfgCD <= 0) return 8;
  if(has(6) && (big || crowd >= 3) && d > 4.5 && BOT.bfgCD <= 0) return 6;
  if(has(7) && d < 3.6 && !big) return 7;                     // the flamethrower also gets around a paladin's shield
  if(has(4) && (big || crowd >= 2 || tg.type === 'knight' || tg.type === 'paladin' || tg.type === 'turret' || tg.type === 'bloat') && d > 4) return 4;
  if(has(5) && d > 2.2) return 5;
  if(has(3) && d < 6.5) return 3;
  if(has(2)) return 2;
  if(has(3)) return 3;
  return owned[1] ? 1 : 0;
}
// turn toward an angle the way a hand on a mouse would: fast flick, eased landing
function botTurn(want, maxStep){
  const d = angleDiff(want, player.angle);
  player.angle += clamp(d * 0.22, -maxStep, maxStep);
  return d;
}
function botFight(tg){
  const dx = tg.x - player.x, dy = tg.y - player.y, d = Math.hypot(dx, dy);
  if(BOT.tRef !== tg){ BOT.tRef = tg; BOT.acq = 8 + Math.random() * 14; BOT.tvx = 0; BOT.tvy = 0; BOT.tpx = tg.x; BOT.tpy = tg.y; }
  BOT.tvx += ((tg.x - BOT.tpx) - BOT.tvx) * 0.2; BOT.tvy += ((tg.y - BOT.tpy) - BOT.tvy) * 0.2;
  BOT.tpx = tg.x; BOT.tpy = tg.y;
  if(BOT.acq > 0) BOT.acq--;
  if(--BOT.wpnT <= 0){
    BOT.wpnT = 40;
    const w = botWeapon(tg, d);
    if(w !== weapon && w !== pendingWeapon && switchT === 0) selectWeapon(w, true);
  }
  const wp = (pendingWeapon >= 0 && switchT > 0) ? pendingWeapon : weapon;
  // aim — leading slow projectiles — with a little human wobble
  const ps = wp === 4 ? 0.17 : wp === 5 ? 0.13 : wp === 6 ? 0.1 : wp === 8 ? 0.085 : 0;
  let ax = tg.x, ay = tg.y;
  if(ps){ const tt = d / ps; ax += BOT.tvx * tt * 0.8; ay += BOT.tvy * tt * 0.8; }
  const wob = Math.sin(gTime * 2.1 + BOT.seed) * 0.4 * tg.hitR / Math.max(1, d);
  const da = botTurn(Math.atan2(ay - player.y, ax - player.x) + wob, 0.11);
  // pull the trigger once the crosshair is on it
  const ca = Math.cos(player.angle), sa = Math.sin(player.angle);
  let ok = BOT.acq <= 0 && switchT === 0 && Math.abs(da) < Math.max(0.03, Math.atan2(tg.hitR * 0.85, d)) * (wp === 3 ? 1.6 : 1);
  if(wp === 4) ok = ok && d > 2.8 && rayDist(player.x, player.y, ca, sa, 3) > 2.7;
  if(wp === 6) ok = ok && d > 3.5 && BOT.bfgCD <= 0 && rayDist(player.x, player.y, ca, sa, 4) > 3.5;
  if(wp === 8) ok = ok && d > 4.5 && BOT.bfgCD <= 0 && rayDist(player.x, player.y, ca, sa, 5) > 4.6;
  if(wp === 7) ok = ok && d < 4.2;
  if(wp <= 1) ok = ok && d < tg.hitR + 1.15;
  botIn.fire = ok;
  if(ok && (wp === 6 || wp === 8)) BOT.bfgCD = 200;
  // keep the right distance for the gun, strafe, back off from biters
  const melee = wp <= 1, R = BOT_RANGE[wp];
  const biter = !melee && (tg.type === 'demon' || tg.type === 'phantom' || tg.type === 'knight' || tg.type === 'paladin' || tg === boss);
  let f;
  if(melee) f = d > tg.hitR + 0.75 ? 1 : 0;
  else if(d > R[1]) f = 1;
  else if(d < R[0] || (biter && d < 2.6)) f = -1;
  else f = Math.sin(gTime * 0.9 + BOT.seed) > 0.6 ? 0.4 : 0;
  if(--BOT.strafeT <= 0){
    BOT.strafe = Math.random() < 0.5 ? -1 : 1; BOT.strafeT = 35 + Math.random() * 70;
    if(Math.random() < 0.15) BOT.strafe = 0;
  }
  botIn.f = f;
  botIn.s = melee && d < 2 ? BOT.strafe * 0.3 : BOT.strafe;
}
// sidestep fireballs heading our way (not every single one — it's only human)
function botDodge(){
  let best = null, bt = 1e9;
  for(const p of projectiles){
    if(p.mine) continue;
    if(p.botRoll === undefined) p.botRoll = Math.random();
    if(p.botRoll < 0.2) continue;
    const dx = player.x - p.x, dy = player.y - p.y, vl = Math.hypot(p.vx, p.vy) || 1;
    const along = (dx * p.vx + dy * p.vy) / vl;
    if(along <= 0 || along > 5) continue;
    const lat = (-dx * p.vy + dy * p.vx) / vl;
    if(Math.abs(lat) > 0.75) continue;
    const t = along / vl;
    if(t < bt){ bt = t; best = { p, lat, vl }; }
  }
  if(!best || bt > 45) return;
  const { p, lat, vl } = best, sg = lat >= 0 ? 1 : -1;
  const nx = -p.vy / vl * sg, ny = p.vx / vl * sg;            // away from the fireball's line
  const a = player.angle, rs = nx * -Math.sin(a) + ny * Math.cos(a), fs = nx * Math.cos(a) + ny * Math.sin(a);
  botIn.s = rs >= 0 ? 1 : -1; BOT.strafe = botIn.s; BOT.strafeT = 25;
  if(Math.abs(fs) > 0.7) botIn.f = fs > 0 ? 1 : -1;
}
// don't strafe into walls or step onto lava / coolant mid-fight
function botSafeMove(){
  const a = player.angle, ca = Math.cos(a), sa = Math.sin(a);
  const onHaz = HAZ[cellIdx(player.x, player.y)];
  const ok = (f, s) => {
    let mx = f * ca - s * sa, my = f * sa + s * ca; const l = Math.hypot(mx, my);
    if(l < 0.01) return true;
    mx /= l; my /= l;
    const x = player.x + mx * 0.6, y = player.y + my * 0.6;
    return freeAt(x, y, 0.2) && (onHaz || !HAZ[cellIdx(x, y)]);
  };
  if(botIn.s && !ok(0, botIn.s)){ botIn.s = -botIn.s; BOT.strafe = botIn.s; if(!ok(0, botIn.s)) botIn.s = 0; }
  if(botIn.f < 0 && !ok(-1, 0)) botIn.f = 0;
  if(botIn.f > 0 && !onHaz && !ok(1, 0) && HAZ[cellIdx(player.x + ca * 0.6, player.y + sa * 0.6)]) botIn.f = 0;
}
function botUnstick(){
  if((tick % 40) === 0){
    const moved = Math.hypot(player.x - BOT.sx, player.y - BOT.sy);
    if(moved < 0.12 && (botIn.f || botIn.s) && BOT.unstick <= 0){
      if(++BOT.stuck >= 2){ BOT.unstick = 30; BOT.ustS = Math.random() < 0.5 ? -1 : 1; BOT.path = null; BOT.stuck = 0; }
    } else BOT.stuck = 0;
    BOT.sx = player.x; BOT.sy = player.y;
  }
  if(BOT.unstick > 0){ BOT.unstick--; botIn.f = -0.6; botIn.s = BOT.ustS; }
}

// ---------- getting around: BFS over the grid (doors are fine, secrets and lava are not) ----------
function botPass(i, allowHaz){
  const m = MAP[i];
  if(m === 1) return false;
  if(m === 2 && DOORS[DOORAT[i]].secret) return false;
  return allowHaz || !HAZ[i];
}
function botBFS(from, allowHaz){
  const N = MAP.length;
  if(!botDist || botDist.length !== N){ botDist = new Int16Array(N); botPrev = new Int32Array(N); botQ = new Int32Array(N); }
  botDist.fill(-1);
  let h = 0, t = 0; botQ[t++] = from; botDist[from] = 0; botPrev[from] = -1;
  while(h < t){
    const i = botQ[h++], d = botDist[i] + 1, r = (i / MCOLS) | 0, c = i - r * MCOLS;
    if(c > 0 && botDist[i - 1] < 0 && botPass(i - 1, allowHaz)){ botDist[i - 1] = d; botPrev[i - 1] = i; botQ[t++] = i - 1; }
    if(c < MCOLS - 1 && botDist[i + 1] < 0 && botPass(i + 1, allowHaz)){ botDist[i + 1] = d; botPrev[i + 1] = i; botQ[t++] = i + 1; }
    if(r > 0 && botDist[i - MCOLS] < 0 && botPass(i - MCOLS, allowHaz)){ botDist[i - MCOLS] = d; botPrev[i - MCOLS] = i; botQ[t++] = i - MCOLS; }
    if(r < MROWS - 1 && botDist[i + MCOLS] < 0 && botPass(i + MCOLS, allowHaz)){ botDist[i + MCOLS] = d; botPrev[i + MCOLS] = i; botQ[t++] = i + MCOLS; }
  }
}
// how far out of the way the bot will walk for an item
function itemWant(type){
  switch(type){
    case 'stim': return hp < 100 ? (100 - hp) / 12 : 0;
    case 'medkit': return hp < 100 ? (100 - hp) / 10 + 2 : 0;
    case 'orb': return 10;
    case 'garmor': return armor < 100 ? 6 : 0;
    case 'barmor': return armor < 200 ? 8 : 0;
    case 'hbonus': case 'abonus': return 2;
    case 'clip': case 'bullets': return ammo.bul < 100 ? 4 : 0;
    case 'shells': case 'shellbox': return owned[3] && ammo.shl < 25 ? 5 : 0;
    case 'rocket': case 'rocketbox': return owned[4] && ammo.rkt < 10 ? 5 : 0;
    case 'cell': case 'cellpack': return (owned[5] || owned[6] || owned[8]) && ammo.cel < 150 ? 5 : 0;
    case 'gascan': case 'gastank': return owned[7] && ammo.fuel < 100 ? 5 : 0;
    case 'w_saw': return owned[1] ? 0 : 8;
    case 'w_shotgun': case 'w_rocket': case 'w_plasma': case 'w_bfg': case 'w_flame': case 'w_bfg9': return 8;
  }
  return 0;
}
function botPickGoal(){
  let best = -1, bs = 1e9;
  for(const p of pickups){
    const i = cellIdx(p.x, p.y), d = botDist[i];
    if(d < 0) continue;
    const want = itemWant(p.type);
    if(want > 0 && d <= want && d - want < bs){ bs = d - want; best = i; }
  }
  for(const e of enemies){
    if(e.dead || e.type === 'barrel') continue;
    const i = cellIdx(e.x, e.y), d = botDist[i];
    if(d < 0) continue;
    const s = d + (e === boss && !ATT.bossScene ? 30 : 0);
    if(s < bs){ bs = s; best = i; }
  }
  return best;
}
function botPlan(){
  const pc = cellIdx(player.x, player.y);
  botBFS(pc, false);
  let goal = botPickGoal();
  if(goal < 0){ botBFS(pc, true); goal = botPickGoal(); }
  BOT.path = null; BOT.pi = 0;
  if(goal < 0 || goal === pc) return;
  const P = [];
  for(let i = goal; i !== pc && i >= 0; i = botPrev[i]) P.push(i);
  BOT.path = P.reverse();
}
function botFatLos(i){
  const tx = (i % MCOLS) + 0.5, ty = ((i / MCOLS) | 0) + 0.5;
  const dx = tx - player.x, dy = ty - player.y, d = Math.hypot(dx, dy) || 1, nx = -dy / d * 0.2, ny = dx / d * 0.2;
  return losClear(player.x + nx, player.y + ny, tx + nx, ty + ny) && losClear(player.x - nx, player.y - ny, tx - nx, ty - ny);
}
function botFollow(){
  if(--BOT.pathT <= 0 || !BOT.path){ botPlan(); BOT.pathT = 45; }
  const P = BOT.path;
  if(!P || !P.length) return false;
  const k = P.indexOf(cellIdx(player.x, player.y), BOT.pi);
  if(k >= 0) BOT.pi = k + 1;
  if(BOT.pi >= P.length){ BOT.path = null; return false; }
  // head for the furthest path cell we can walk to in a straight line
  let wi = BOT.pi;
  for(let j = BOT.pi + 1; j < Math.min(P.length, BOT.pi + 7); j++){ if(botFatLos(P[j])) wi = j; else break; }
  const tx = (P[wi] % MCOLS) + 0.5, ty = ((P[wi] / MCOLS) | 0) + 0.5;
  const da = botTurn(Math.atan2(ty - player.y, tx - player.x), 0.075);
  botIn.f = Math.abs(da) < 0.6 ? 1 : 0.35;
  return true;
}

// ============================================================
// MAIN LOOP — fixed 60 Hz simulation, render every display frame
// (the game now runs at the same speed on 60, 120 or 144 Hz screens)
// ============================================================
const STEP = 1000 / 60;
let frameAvg = 16, slowTime = 0, slowHinted = false;
function mainLoop(now){
  requestAnimationFrame(mainLoop);
  if(attract && appState === 'title'){ attractFrame(now); return; }     // gameplay demo behind the title menu
  if(appState !== 'game'){ lastFrame = now; return; }
  let dt = now - lastFrame; lastFrame = now;
  if(dt > 250) dt = 250; if(dt < 0) dt = 0;
  if(!paused && !dead && !ending && dt > 0){
    frameAvg += (dt - frameAvg) * 0.02;
    slowTime = frameAvg > 24 ? slowTime + dt : 0;
    if(slowTime > 4000 && !slowHinted && settings.resH > 360){ slowHinted = true; msg(T('low_fps'), '#ffaa44'); }
  }
  if(!paused){
    acc += dt;
    let n = 0;
    while(acc >= STEP && n < 6){ update(); acc -= STEP; n++; if(appState !== 'game' || paused) break; }
    if(n === 6) acc = 0;
    if(appState === 'game'){ render(); if(fullMapOpen && (frameNo & 3) === 0) renderFullMap(); }
  } else if(needsRender){ render(); needsRender = false; }
}

// ---------- boot ----------
buildTextureSets();
buildTextureSets2();
buildTextureSets3();
buildDetailSets();
buildSprites();
buildSprites2();
buildSprites3();
buildPropSprites();
buildFaces();
buildWeaponModels();
applyLanguage();
syncSliders();
openMenu('panelMain');
startMenuBg();

requestAnimationFrame(mainLoop);
